name: Generate Guide Article

on:
  schedule:
    - cron: '30 1 * * *' # 毎日 08:30 WIB (UTC+7)
  workflow_dispatch:
    inputs:
      topic_id:
        description: '生成するトピックID(任意。空なら台帳から次のトピックを自動選択)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: generate-guide
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 生成すべきトピックが無い日は generated=false で正常終了する(何もしない)。
      # 出典が1件も取得できない等の失敗はここで exit 1 になり、ワークフローが失敗として見える。
      - name: Generate guide article
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GUIDE_TOPIC_ID: ${{ github.event.inputs.topic_id }}
        run: npm run generate-guide

      # PR本文 = 固定文 + (URL除去が発生した場合のみ)除去したURLと該当行。レビュー時に目視できるようにする。
      - name: Compose PR body
        if: steps.gen.outputs.generated == 'true'
        env:
          TOPIC_ID: ${{ steps.gen.outputs.topic_id }}
        run: |
          {
            cat <<'EOF' | sed "s/__TOPIC_ID__/$TOPIC_ID/"
          バリ向けガイド記事の自動生成ドラフトです(トピックID: `__TOPIC_ID__`)。`draft: true` のため、マージしても公開されません。

          - 本文は、台帳(`src/data/guide-topics.json`)と出典一覧(`src/data/official-sources.json`)に登録された公的機関・一次情報の公開ページだけを根拠に生成しています。
          - 「要確認」と書かれた箇所は、資料に記載がない・資料間で矛盾する事項です。公的機関の最新情報で確認してから公開してください。
          - `references` の各URLと本文の内容を照合してください。`lastVerified` は資料を取得・照合した日です。
          - 却下する場合はこのPRを **close** してください(同じトピックは再生成されません)。

          Slackの「承認して公開」で `draft: false` にしてmergeできます。
          EOF
            if [ -f "$RUNNER_TEMP/guide-removed-urls.md" ]; then
              echo
              cat "$RUNNER_TEMP/guide-removed-urls.md"
            fi
          } > "$RUNNER_TEMP/guide-pr-body.md"

      - name: Create pull request
        if: steps.gen.outputs.generated == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            src/content/articles/${{ steps.gen.outputs.topic_id }}.md
            src/data/guide-source-snapshots/${{ steps.gen.outputs.topic_id }}.json
          commit-message: 'Add guide draft: ${{ steps.gen.outputs.topic_id }}'
          branch: auto/guide-${{ steps.gen.outputs.topic_id }}
          title: 'ガイド記事ドラフト: ${{ steps.gen.outputs.title }}'
          body-path: ${{ runner.temp }}/guide-pr-body.md

      # GITHUB_TOKENで作成したPRは pull_request イベントを発火しないため、crawl-articles.yml と同様にここでSlack通知する。
      - name: Notify Slack (draft article review + approve button)
        if: steps.gen.outputs.generated == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/notify-draft-pr.mjs --pr=${{ steps.cpr.outputs.pull-request-number }}

      # 生成できなかったトピック(出典本文0件・検証失敗)は job summary に出力済み。同じトピックで失敗し続けても
      # 気づけるよう、id ごとに Issue も立てる(同名の open な Issue があれば作らない)。全候補が失敗した場合も実行する。
      - name: Report failed topics as issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE="$RUNNER_TEMP/guide-generate-failures.json"
          if [ ! -f "$FILE" ]; then
            echo "失敗したトピックはありません。"
            exit 0
          fi
          jq -c '.[]' "$FILE" | while read -r row; do
            ID=$(echo "$row" | jq -r .id)
            REASON=$(echo "$row" | jq -r .reason)
            TITLE="ガイド記事の生成に失敗: $ID"
            EXISTING=$(gh issue list --state open --limit 100 --search "\"$TITLE\" in:title" --json title --jq "[.[] | select(.title == \"$TITLE\")] | length")
            if [ "$EXISTING" != "0" ]; then
              echo "同名の open issue が既にあるため作成しません: $TITLE"
              continue
            fi
            printf '%s\n\n%s\n\n%s\n' "トピック \`$ID\` を自動生成できませんでした(実行: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)。" "$REASON" "出典(official-sources.json / extraReferences)を見直すか、台帳で status を on-hold にしてください。" > "$RUNNER_TEMP/issue.md"
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          done
