name: Notify Draft PR

on:
  pull_request:
    types: [opened]
    paths:
      - 'src/content/articles/**'

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  notify:
    # auto/articles-* はcrawl-articles.yml側、auto/guide-*(ガイドの生成・トピック提案・月次改訂。
    # auto/guide-topics-* / auto/guide-refresh-* を含む)は各ワークフロー側で既にSlack通知済みのため、二重送信を防ぐためスキップする
    if: ${{ !startsWith(github.head_ref, 'auto/articles-') && !startsWith(github.head_ref, 'auto/guide-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Notify Slack (draft article review)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
        run: node scripts/notify-draft-pr.mjs --pr=${{ github.event.pull_request.number }}
